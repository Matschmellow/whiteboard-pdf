<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard → PDF</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mut:#6b7280;--ac:#2563eb;--bd:#d9dce1}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1f2124;--tx:#eceef1;--mut:#9aa0a8;--ac:#5b8cff;--bd:#33373d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:28px 0}
h1{font-size:1.6rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
#drop{border:2px dashed var(--bd);text-align:center;padding:36px 16px;cursor:pointer}
#drop.over{border-color:var(--ac)}
label{display:block;font-weight:600;margin:0 0 6px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item span{overflow-wrap:anywhere}
.item small{color:var(--mut);display:block}
a.btn{background:var(--ac);color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.err{color:#dc2626}
</style>
</head>
<body>
<main>
  <h1>Whiteboard → PDF</h1>
  <p class="s">ZIP-Export des Whiteboards auswählen, daraus wird ein hochaufgelöstes PDF. Alles läuft lokal in deinem Browser, nichts wird hochgeladen.</p>

  <div class="card row">
    <div><label for="bg">Hintergrund</label>
      <select id="bg"><option value="dark">Dunkel (wie Original)</option><option value="light">Hell (zum Drucken)</option></select></div>
    <div><label for="res">Qualität</label>
      <select id="res"><option value="vector" selected>Vektor (unbegrenzt scharf)</option><option value="3">Bild 3×</option><option value="4">Bild 4× (max.)</option></select></div>
  </div>

  <div class="card" id="drop">
    <strong>ZIP-Dateien hier ablegen</strong><br><span style="color:var(--mut)">oder tippen zum Auswählen (mehrere möglich)</span>
    <input id="file" type="file" accept=".zip,application/zip" multiple hidden>
  </div>

  <div class="card" id="out" hidden></div>
</main>

<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const XLINK = "http://www.w3.org/1999/xlink";
const MAX_PIXELS = 14e6;
const MAX_IMG = 4096;

const LIBS = [
  ["JSZip", () => window.JSZip, ["https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"]],
  ["jsPDF", () => window.jspdf, ["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]],
  ["svg2pdf", () => window.jspdf && window.jspdf.jsPDF.API.svg, ["https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js", "https://unpkg.com/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"]]
];

function loadScript(u) {
  return new Promise((ok, no) => {
    const e = document.createElement("script");
    e.src = u; e.onload = ok; e.onerror = () => no(new Error(u));
    document.head.appendChild(e);
  });
}

let ready;
function loadLibs() {
  return ready || (ready = (async () => {
    const missing = [];
    for (const [name, check, urls] of LIBS) {
      for (const u of urls) {
        if (check()) break;
        try { await loadScript(u); } catch (e) {}
      }
      if (!check()) missing.push(name);
    }
    return missing;
  })());
}
loadLibs();

const drop = $("drop"), file = $("file"), out = $("out");
drop.onclick = () => file.click();
file.onchange = () => handle([...file.files]);
["dragover","dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => handle([...ev.dataTransfer.files]));

function row(name) {
  out.hidden = false;
  const d = document.createElement("div");
  d.className = "item";
  d.innerHTML = "<span></span><small>Wird verarbeitet …</small>";
  d.firstChild.textContent = name;
  out.appendChild(d);
  return d;
}

async function handle(files) {
  for (const f of files) {
    const item = row(f.name);
    const info = item.querySelector("small");
    try {
      info.textContent = "Bibliotheken werden geladen …";
      const miss = await loadLibs();
      if (miss.includes("JSZip") || miss.includes("jsPDF"))
        throw new Error("Bibliothek " + miss.join(", ") + " konnte nicht geladen werden.");
      const r = await convert(f, t => info.textContent = t, miss);
      info.remove();
      const wrap = document.createElement("span");
      wrap.innerHTML = "<small></small>";
      wrap.firstChild.textContent = `${r.info} · ${(r.blob.size/1048576).toFixed(1)} MB`;
      item.appendChild(wrap);
      const a = document.createElement("a");
      a.className = "btn"; a.textContent = "PDF laden";
      a.href = URL.createObjectURL(r.blob);
      a.download = f.name.replace(/\.zip$/i, "") + ".pdf";
      item.appendChild(a);
    } catch (e) {
      info.className = "err";
      info.textContent = "Fehler: " + e.message;
    }
  }
  file.value = "";
}

function findEntry(zip, basePath, src) {
  let s = src.split(/[?#]/)[0].replace(/\\/g, "/");
  try { s = decodeURIComponent(s); } catch (e) {}
  const dir = basePath.includes("/") ? basePath.slice(0, basePath.lastIndexOf("/") + 1) : "";
  const parts = [];
  for (const p of (s.startsWith("/") ? s.slice(1) : dir + s).split("/")) {
    if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p);
  }
  const path = parts.join("/");
  let e = zip.file(path) || zip.file(s.replace(/^\.?\//, ""));
  if (e) return e;
  const low = path.toLowerCase(), bn = low.split("/").pop();
  return Object.values(zip.files).find(z => !z.dir && z.name.toLowerCase() === low)
      || Object.values(zip.files).find(z => !z.dir && z.name.toLowerCase().split("/").pop() === bn) || null;
}

function sniffMime(b64, name) {
  if (b64.startsWith("iVBOR")) return "image/png";
  if (b64.startsWith("/9j/")) return "image/jpeg";
  if (b64.startsWith("R0lGO")) return "image/gif";
  if (b64.startsWith("UklGR")) return "image/webp";
  if (b64.startsWith("PHN2Z") || b64.startsWith("PD94b")) return "image/svg+xml";
  const ext = (name.match(/\.(\w+)$/) || [])[1];
  return { jpg: "image/jpeg", jpeg: "image/jpeg", svg: "image/svg+xml" }[(ext || "").toLowerCase()] || "image/" + (ext || "png").toLowerCase();
}

async function loadImage(src, zip, basePath) {
  let uri;
  if (/^data:/i.test(src)) uri = src;
  else if (/^(https?:)?\/\//i.test(src)) {
    const blob = await (await fetch(src)).blob();
    uri = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(blob); });
  } else {
    const e = findEntry(zip, basePath, src);
    if (!e) return null;
    const b64 = await e.async("base64");
    uri = `data:${sniffMime(b64, e.name)};base64,${b64}`;
  }
  const im = new Image();
  im.src = uri;
  await im.decode();
  let w = im.naturalWidth || 1024, h = im.naturalHeight || 1024;
  const k = Math.min(1, MAX_IMG / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const jpeg = /^data:image\/jpe?g/i.test(uri);
  const ctx = c.getContext("2d");
  if (jpeg) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return { uri: jpeg ? c.toDataURL("image/jpeg", 0.92) : c.toDataURL("image/png"), w, h };
}

function getMatrixTransform(el) {
  const st = window.getComputedStyle(el);
  const t = st.transform;
  if (!t || t === "none") return "";
  return t;
}

async function convert(f, status, miss = []) {
  status("ZIP wird entpackt …");
  const zip = await JSZip.loadAsync(f);
  const entry = Object.values(zip.files).find(z => !z.dir && /\.html?$/i.test(z.name));
  if (!entry) throw new Error("Keine HTML-Datei in der ZIP gefunden.");
  
  const rawHtml = await entry.async("string");

  // Unsichtbares Iframe für originalgetreue CSS-Berechnungen nutzen
  status("Layout und Styles werden geladen …");
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "position:absolute;left:-99999px;top:0;width:4000px;height:4000px;border:0;visibility:hidden;";
  document.body.appendChild(iframe);

  const idoc = iframe.contentWindow.document;
  idoc.open();
  idoc.write(rawHtml);
  idoc.close();

  // Warten auf Stylesheets & DOM
  await new Promise(r => setTimeout(r, 100));

  status("Elemente werden erfasst …");
  const root = document.createElementNS(NS, "svg");
  root.setAttribute("style", "position:absolute;left:-99999px;top:0;width:10px;height:10px");
  const layer = document.createElementNS(NS, "g");
  root.appendChild(layer);
  document.body.appendChild(root);

  let n = 0, nImg = 0;

  // Bestimme Board-Referenzkoordinate (Fallback auf body)
  const boardEl = idoc.querySelector(".board, .whiteboard, #board, #whiteboard, main") || idoc.body;
  const boardRect = boardEl.getBoundingClientRect();

  // 1. Bilder erfassen
  const imgs = idoc.querySelectorAll("img, [style*='background-image']");
  for (const el of imgs) {
    let src = el.tagName === "IMG" ? (el.getAttribute("src") || el.getAttribute("data-src")) : null;
    if (!src) {
      const bg = el.style.backgroundImage || window.getComputedStyle(el).backgroundImage;
      const m = bg ? bg.match(/url\((['"]?)(.*?)\1\)/) : null;
      if (m) src = m[2];
    }
    if (!src) continue;

    let res = null;
    try { res = await loadImage(src, zip, entry.name); } catch(e) {}
    if (!res) continue;

    const r = el.getBoundingClientRect();
    const x = r.left - boardRect.left;
    const y = r.top - boardRect.top;
    const w = r.width || res.w;
    const h = r.height || res.h;

    const g = document.createElementNS(NS, "g");
    const im = document.createElementNS(NS, "image");
    im.setAttribute("x", x);
    im.setAttribute("y", y);
    im.setAttribute("width", w);
    im.setAttribute("height", h);
    im.setAttribute("preserveAspectRatio", "none");
    im.setAttribute("href", res.uri);
    im.setAttributeNS(XLINK, "xlink:href", res.uri);

    const op = window.getComputedStyle(el).opacity;
    if (op && +op < 1) im.setAttribute("opacity", op);

    g.appendChild(im);
    layer.appendChild(g);
    nImg++;
  }

  // 2. Vektorstriche (Handschrift/Ink) erfassen
  const inks = idoc.querySelectorAll(".anchor, svg.ink");
  for (const a of inks) {
    const isInkDirect = a.tagName.toLowerCase() === "svg";
    const ink = isInkDirect ? a : a.querySelector("svg.ink");
    if (!ink) continue;

    const r = (isInkDirect ? ink : a).getBoundingClientRect();
    const x = r.left - boardRect.left;
    const y = r.top - boardRect.top;

    const g = document.createElementNS(NS, "g");
    
    // Berechne eventuelle Skalierung/Transformation
    const tf = getMatrixTransform(isInkDirect ? ink : a);
    if (tf && tf !== "none") {
      g.setAttribute("transform", `translate(${x} ${y}) ${tf}`);
    } else {
      g.setAttribute("transform", `translate(${x} ${y})`);
    }

    const s = document.importNode(ink, true);
    s.querySelectorAll(".inkHitTestOverlay").forEach(o => o.remove());
    s.removeAttribute("class");
    s.removeAttribute("tabindex");
    s.removeAttribute("style");
    s.setAttribute("overflow", "visible");

    g.appendChild(s);
    layer.appendChild(g);
    n++;
  }

  iframe.remove();

  if (!n && !nImg) {
    root.remove();
    throw new Error("Keine Handschrift oder Bilder im Whiteboard gefunden.");
  }

  const b = layer.getBBox();
  const pad = 40;
  root.remove();

  const W = Math.ceil(b.width + 2 * pad);
  const H = Math.ceil(b.height + 2 * pad);
  const light = $("bg").value === "light";

  root.setAttribute("viewBox", `${b.x - pad} ${b.y - pad} ${W} ${H}`);
  root.setAttribute("width", W);
  root.setAttribute("height", H);
  root.removeAttribute("style");

  const rect = document.createElementNS(NS, "rect");
  rect.setAttribute("x", b.x - pad);
  rect.setAttribute("y", b.y - pad);
  rect.setAttribute("width", W);
  rect.setAttribute("height", H);
  rect.setAttribute("fill", light ? "#ffffff" : "#1f1f1f");
  root.insertBefore(rect, layer);

  if (light) {
    root.querySelectorAll("[fill]").forEach(e => {
      const fl = e.getAttribute("fill");
      if (fl) {
        e.setAttribute("fill", fl
          .replace(/rgba\(235,\s*235,\s*235,/, "rgba(25,25,25,")
          .replace(/rgba\(31,\s*31,\s*31,/, "rgba(255,255,255,")
        );
      }
    });
  }

  const note = (nImg ? ` · ${nImg} Bild${nImg > 1 ? "er" : ""}` : "");
  const { jsPDF } = window.jspdf;
  const mk = () => new jsPDF({ orientation: W >= H ? "l" : "p", unit: "px", format: [W, H], compress: true });

  if ($("res").value === "vector" && !miss.includes("svg2pdf")) {
    status("Vektor-PDF wird erstellt …");
    try {
      const pdf = mk();
      root.setAttribute("style", "position:absolute;left:-99999px;top:0");
      document.body.appendChild(root);
      await Promise.race([
        pdf.svg(root, { x: 0, y: 0, width: W, height: H }),
        new Promise((_, no) => setTimeout(() => no(new Error("Zeitüberschreitung")), 90000))
      ]);
      root.remove();
      return { blob: pdf.output("blob"), info: "Vektor" + note };
    } catch (e) {
      root.remove();
      console.warn("Vektor-Export fehlgeschlagen, wechsle auf Rasterung:", e);
      status("Vektor fehlgeschlagen, nutze Bild …");
    }
  }

  status("Bild wird in hoher Auflösung gerendert …");
  const svg = new XMLSerializer().serializeToString(root);
  const res = $("res").value === "vector" ? 3 : +$("res").value;
  const scale = Math.min(res, Math.sqrt(MAX_PIXELS / (W * H)));
  const cw = Math.round(W * scale), ch = Math.round(H * scale);
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  const img = new Image();
  img.src = url;
  await img.decode();

  const c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  c.getContext("2d").drawImage(img, 0, 0, cw, ch);
  URL.revokeObjectURL(url);

  const pdf = mk();
  pdf.addImage(c.toDataURL("image/png"), "PNG", 0, 0, W, H, undefined, "FAST");
  return { blob: pdf.output("blob"), info: `Bild ${cw}×${ch} px` + note };
}
</script>
</body>
</html>
